<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WAITLIST</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#010403;color:#e9f5ea;font-family:Arial,Helvetica,sans-serif}
.hero{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.08)),
    url("theme.jpeg") center/cover no-repeat;
}
.hero:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(0,0,0,.28),transparent 35%,rgba(0,0,0,.52)),
    radial-gradient(circle at 50% 50%,transparent 28%,rgba(0,0,0,.58) 100%);
}
.center{
  position:absolute;z-index:2;left:50%;top:53%;
  transform:translate(-50%,-50%);
  width:min(92vw,620px);text-align:center;
}
.brand{
  display:inline-block;margin-bottom:22px;
  padding:8px 18px;border:1px solid rgba(78,255,101,.35);
  background:rgba(0,8,3,.42);backdrop-filter:blur(8px);
  color:#72ff82;font-size:11px;font-weight:950;letter-spacing:.5em;
  text-shadow:0 0 15px rgba(72,255,92,.25)
}
.loading{
  position:relative;width:min(76vw,430px);height:7px;
  margin:0 auto 28px;overflow:hidden;
  border:1px solid rgba(72,255,92,.32);
  background:rgba(0,0,0,.55);
  box-shadow:0 0 25px rgba(60,255,80,.08)
}
.loading .fill{
  position:absolute;left:0;top:0;height:100%;width:0;
  background:linear-gradient(90deg,#0c7a20,#4cff62,#a9ffae);
  box-shadow:0 0 14px rgba(75,255,95,.75);
}
.loading .scan{
  position:absolute;top:0;bottom:0;width:90px;
  background:linear-gradient(90deg,transparent,rgba(205,255,211,.42),transparent);
  animation:scan 2.4s linear infinite
}
@keyframes scan{from{left:-100px}to{left:100%}}
.timer{
  display:flex;justify-content:center;align-items:flex-start;
  gap:clamp(6px,1.5vw,15px);font-variant-numeric:tabular-nums
}
.unit{min-width:clamp(58px,12vw,94px)}
.number{
  font-size:clamp(48px,8vw,82px);font-weight:950;line-height:.88;
  letter-spacing:-.07em;color:#f0f6ee;
  text-shadow:0 2px 28px #000,0 0 22px rgba(70,255,90,.1)
}
.label{
  margin-top:10px;color:#a8b7aa;font-size:8px;font-weight:900;
  letter-spacing:.3em
}
.colon{
  color:#53ff67;font-size:clamp(36px,6vw,62px);line-height:.8;
  text-shadow:0 0 17px rgba(70,255,90,.3)
}
.wait{
  margin-top:35px;padding:16px 38px;cursor:pointer;
  color:#021006;background:linear-gradient(180deg,#78ff88,#25bd3e);
  border:1px solid rgba(137,255,149,.75);border-radius:4px;
  font-size:11px;font-weight:950;letter-spacing:.22em;
  box-shadow:0 0 32px rgba(45,255,70,.18),inset 0 1px rgba(255,255,255,.5);
  transition:.2s
}
.wait:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(45,255,70,.32)}
.x-link{
  display:block;margin-top:16px;color:#82c98c;text-decoration:none;
  font-size:10px;font-weight:800;letter-spacing:.12em
}
.x-link:hover{color:#b4ffbc}
.modal{
  display:none;position:fixed;inset:0;z-index:10;place-items:center;
  padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(13px)
}
.modal.open{display:grid}
.message{
  width:min(90vw,420px);padding:40px 28px;text-align:center;
  background:linear-gradient(145deg,#061309,#010502);
  border:1px solid rgba(72,255,93,.4);border-radius:6px;
  box-shadow:0 30px 100px #000,0 0 40px rgba(52,255,75,.08)
}
.message .symbol{
  color:#68ff78;font-size:38px;text-shadow:0 0 22px rgba(72,255,94,.35)
}
.message h2{color:#e1f5e3;font-size:23px;margin:16px 0 10px}
.message p{color:#91a895;font-size:13px;line-height:1.6;margin:0}
.close{
  margin-top:22px;padding:10px 24px;cursor:pointer;
  color:#79ff89;background:#061208;
  border:1px solid rgba(72,255,94,.35);border-radius:3px;
  font-size:10px;font-weight:900;letter-spacing:.15em
}
@media(max-width:600px){
  .center{top:54%}
  .brand{font-size:8px;margin-bottom:18px}
  .unit{min-width:16vw}.number{font-size:12vw}
  .label{font-size:6px}.colon{font-size:9vw}
  .wait{margin-top:28px}
}
</style>
</head>
<body>
<section class="hero">
  <main class="center">
    <div class="brand">WAITLIST</div>

    <div class="loading" aria-hidden="true">
      <div class="fill" id="fill"></div>
      <div class="scan"></div>
    </div>

    <div class="timer" aria-label="72 hour countdown">
      <div class="unit"><div class="number" id="d">03</div><div class="label">DAYS</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="number" id="h">00</div><div class="label">HOURS</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="number" id="m">00</div><div class="label">MINUTES</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="number" id="s">00</div><div class="label">SECONDS</div></div>
    </div>

    <button class="wait" id="wait">JOIN WAITLIST</button>
    <a class="x-link" href="https://x.com/waitlist_rh" target="_blank" rel="noopener noreferrer">𝕏 @waitlist_rh</a>
  </main>
</section>

<div class="modal" id="modal">
  <div class="message">
    <div class="symbol">◆</div>
    <h2>WE’LL BE AVAILABLE SOON</h2>
    <p>The line is forming. Come back when the countdown is complete.</p>
    <button class="close" id="close">UNDERSTOOD</button>
  </div>
</div>

<script>
// Fixed launch time — same for every visitor, in every timezone.
// Set this to the exact moment the countdown should hit zero, as an ISO
// string with an explicit UTC offset (so it doesn't shift per-browser timezone).
// Example: "2026-08-26T18:00:00Z" = Aug 26 2026, 18:00 UTC.
const LAUNCH_ISO="2026-08-26T18:00:00Z";
const end=new Date(LAUNCH_ISO).getTime();
const DURATION_MS=72*60*60*1000; // used only for the progress bar fill %

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");

function tick(){
  const remaining=Math.max(0,end-Date.now());
  const total=Math.floor(remaining/1000);
  const days=Math.floor(total/86400);
  const hours=Math.floor(total%86400/3600);
  const mins=Math.floor(total%3600/60);
  const secs=total%60;

  $("d").textContent=pad(days);
  $("h").textContent=pad(hours);
  $("m").textContent=pad(mins);
  $("s").textContent=pad(secs);

  const progress=Math.min(100,Math.max(0,
    ((DURATION_MS-remaining)/DURATION_MS)*100
  ));
  $("fill").style.width=progress+"%";

  if(remaining<=0){
    clearInterval(timerHandle);
  }
}
tick();
const timerHandle=setInterval(tick,1000);

$("wait").onclick=()=>$("modal").classList.add("open");
$("close").onclick=()=>$("modal").classList.remove("open");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};
</script>
</body>
</html>
